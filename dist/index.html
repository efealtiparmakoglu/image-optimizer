<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image optimizer — offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: ui-monospace, monospace;
    background: #101418; color: #d7dde3;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; margin: 0; gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  #drop {
    width: 560px; min-height: 80px; border: 2px dashed #2c343c;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #7a848e; padding: 10px; text-align: center;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input[type="text"] {
    font: inherit; background: #1b2129; color: #d7dde3;
    border: 1px solid #2c343c; padding: 4px 8px;
  }
  input[type="range"] { width: 160px; }
  button {
    font: inherit; background: #1b2129; color: #d7dde3;
    border: 1px solid #2c343c; padding: 5px 10px; cursor: pointer;
  }
  .job {
    width: 560px; display: flex; gap: 10px; align-items: center;
    background: #1b2129; border: 1px solid #2c343c; padding: 8px;
  }
  .job strong { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .job span { color: #7fdc9c; }
  .job a { color: #4d9de0; }
  #summary { min-height: 18px; color: #ffd166; }
</style>
</head>
<body>
  <h1>image optimizer <small>(offline — files never leave your machine)</small></h1>
  <div id="drop">drop images here, or click to pick files<br>png / jpeg / webp</div>
  <div class="controls">
    <label>format
      <select id="format">
        <option value="webp">webp</option>
        <option value="jpeg">jpeg</option>
        <option value="png">png</option>
      </select>
    </label>
    <label>quality <input id="quality" type="range" min="5" max="95" value="70"> <span id="quality-value">70%</span></label>
    <label>resize <input id="resize" type="text" placeholder="50% / 800x600 / 800" size="10"></label>
    <button id="optimize">optimize all</button>
    <button id="clear">clear</button>
  </div>
  <div id="summary">add images, pick settings, hit optimize</div>
  <div id="queue"></div>
<script type="module">
// core.ts (inlined)
/* Pure helpers: byte formatting, target-size estimation, output name
 * derivation and batch summaries. Canvas work lives in ui.ts. */

export function formatBytes(bytes        )         {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

export function savingsPercent(before        , after        )         {
  if (before <= 0) return 0;
  return Math.round(((before - after) / before) * 100);
}

/** Clamp quality into 0.05..0.95 (browsers reject 0/1 quality anyway). */
export function clampQuality(quality        )         {
  return Math.min(0.95, Math.max(0.05, quality));
}

/** Derive "photo.jpg" -> "photo-opt.webp" honoring the chosen format. */
export function outputName(name        , format                         )         {
  const dot = name.lastIndexOf(".");
  const base = dot > 0 ? name.slice(0, dot) : name;
  return `${base}-opt.${format}`;
}

/** Suggest an output format: PNG when the source has transparency or is
 * already PNG (keep lossless), else WebP for the best ratio. */
export function suggestFormat(mime        )                          {
  if (mime === "image/png") return "png";
  return "webp";
}

/** Estimate: WebP/JPEG re-encode at quality q lands near a fraction of
 * the original; calibrated buckets rather than a fake formula. */
export function estimateOutputBytes(
  originalBytes        ,
  quality        ,
  format                         ,
)         {
  const q = clampQuality(quality);
  const fraction = format === "png" ? 0.9 : format === "jpeg" ? 0.25 + q * 0.6 : 0.2 + q * 0.5;
  return Math.max(1, Math.round(originalBytes * fraction));
}

                            
               
                        
                                                   
                                  
 

                               
                
                        
                      
                       
                     
 

export function summarize(items             )               {
  const done = items.filter((item) => item.outputBytes !== null);
  const totalOriginal = done.reduce((sum, item) => sum + item.originalBytes, 0);
  const totalOutput = done.reduce((sum, item) => sum + (item.outputBytes ?? 0), 0);
  return {
    count: items.length,
    totalOriginal,
    totalOutput,
    savedPercent: savingsPercent(totalOriginal, totalOutput),
    failures: items.filter((item) => item.outputBytes === null).map((item) => item.name),
  };
}

/** Parse "800x600", "50%", "1200" (width) resize specs. */
export function parseResize(
  spec        ,
  originalWidth        ,
  originalHeight        ,
)                                    {
  const text = spec.trim().toLowerCase();
  if (text === "") return { width: originalWidth, height: originalHeight };
  const percent = /^(\d+(?:\.\d+)?)%$/.exec(text);
  if (percent) {
    const factor = Number(percent[1]) / 100;
    return {
      width: Math.max(1, Math.round(originalWidth * factor)),
      height: Math.max(1, Math.round(originalHeight * factor)),
    };
  }
  const wxh = /^(\d+)\s*[x×]\s*(\d+)$/.exec(text);
  if (wxh) {
    return { width: Number(wxh[1]), height: Number(wxh[2]) };
  }
  const widthOnly = /^(\d+)$/.exec(text);
  if (widthOnly) {
    const width = Number(widthOnly[1]);
    return { width, height: Math.max(1, Math.round((width * originalHeight) / originalWidth)) };
  }
  throw new Error(`bad resize spec: "${spec}"`);
}

/* DOM layer: file picker + drop zone, quality slider, resize spec,
 * batch queue with per-file before/after rows, download links.
 * All compression runs through <canvas> — files never leave the machine. */


const $ = (id        )              => document.getElementById(id)               ;

                                 
             
                
                 
 

let jobs        = [];
let quality = 0.7;
let resizeSpec = "";
let format                          = "webp";

function collectFiles(files                 )       {
  if (!files) return;
  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      jobs.push({
        name: file.name,
        originalBytes: file.size,
        outputBytes: null,
        format: suggestFormat(file.type),
        file,
        width: img.naturalWidth,
        height: img.naturalHeight,
      });
      URL.revokeObjectURL(url);
      paintQueue();
    };
    img.src = url;
  }
}

function processAll()       {
  format = ($("format")                     ).value                           ;
  quality = clampQuality(Number(($("quality")                    ).value) / 100);
  resizeSpec = ($("resize")                    ).value;
  optimizeNext(0);
}

function optimizeNext(index        )       {
  const job = jobs[index];
  if (!job) {
    paintQueue();
    ($("summary")               ).textContent = summaryText(summarize(jobs));
    return;
  }
  const url = URL.createObjectURL(job.file);
  const img = new Image();
  img.onload = () => {
    let { width, height } = { width: img.naturalWidth, height: img.naturalHeight };
    try {
      const resized = parseResize(resizeSpec, width, height);
      width = resized.width;
      height = resized.height;
    } catch {
      /* bad spec: keep original size */
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    ctx.drawImage(img, 0, 0, width, height);
    const mime = format === "png" ? "image/png" : format === "jpeg" ? "image/jpeg" : "image/webp";
    canvas.toBlob(
      (blob) => {
        if (!blob) {
          job.outputBytes = null;
        } else {
          job.outputBytes = blob.size;
          job.file = new File([blob], outputName(job.name, format), { type: mime });
        }
        paintQueue();
        optimizeNext(index + 1);
      },
      mime,
      quality,
    );
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function summaryText(summary                              )         {
  return (
    `${summary.count} file(s): ${formatBytes(summary.totalOriginal)} -> ` +
    `${formatBytes(summary.totalOutput)} (saved ${summary.savedPercent}%)` +
    (summary.failures.length ? ` — failed: ${summary.failures.join(", ")}` : "")
  );
}

function paintQueue()       {
  const queueEl = $("queue");
  queueEl.innerHTML = "";
  for (const job of jobs) {
    const row = document.createElement("div");
    row.className = "job";
    const after = job.outputBytes === null ? "…" : formatBytes(job.outputBytes);
    const percent =
      job.outputBytes === null ? "" : ` (${savingsPercent(job.originalBytes, job.outputBytes)}%)`;
    row.innerHTML = `<strong></strong><span></span>`;
    (row.querySelector("strong")               ).textContent = job.name;
    (row.querySelector("span")               ).textContent =
      `${formatBytes(job.originalBytes)} -> ${after}${percent}`;
    if (job.outputBytes !== null) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(job.file);
      link.download = outputName(job.name, format);
      link.textContent = "download";
      row.appendChild(link);
    }
    queueEl.appendChild(row);
  }
  $("summary").textContent = summaryText(summarize(jobs));
}

function setup()       {
  const drop = $("drop");
  drop.addEventListener("dragover", (event) => event.preventDefault());
  drop.addEventListener("drop", (event) => {
    event.preventDefault();
    collectFiles((event             ).dataTransfer?.files ?? null);
  });
  drop.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;
    input.addEventListener("change", () => collectFiles(input.files));
    input.click();
  });
  $("quality")?.addEventListener("input", (event) => {
    $("quality-value").textContent = `${(event.target                    ).value}%`;
  });
  $("optimize")?.addEventListener("click", processAll);
  $("clear")?.addEventListener("click", () => {
    jobs = [];
    paintQueue();
  });
}

setup();

</script>
</body>
</html>
